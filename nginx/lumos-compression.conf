# ─────────────────────────────────────────────────────────────
# Lumos HRMS — response compression (gzip)
# Install:  cp lumos-compression.conf /etc/nginx/snippets/lumos-compression.conf
# Use:      `include snippets/lumos-compression.conf;` INSIDE each proxying `server { }` block (see lumos.conf).
# Apply:    nginx -t && systemctl reload nginx
#
# Why inside server{} and not http{}: distro nginx.conf usually already has `gzip on;` at http level, and repeating a
# single-value directive in the SAME context is a hard error ("directive is duplicate"). Server level overrides it cleanly.
#
# Compresses only text-like responses (JS, CSS, JSON API, SVG, plain text/CSV/XML). text/html is always eligible.
# Images (png/jpg/webp), fonts (woff/woff2), zip/pdf are already compressed and are NOT listed on purpose.
# Cache-Control / ETag from the app are passed through untouched (nginx only turns a strong ETag into a weak one
# when it compresses, which is the correct behaviour). Brotli is intentionally not used: measured gain over gzip is
# ~0–5% on our bundles and it needs a third-party nginx module.
# ─────────────────────────────────────────────────────────────
gzip              on;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_proxied      any;      # proxied (Express) responses; also when a CDN/proxy in front adds a Via header
gzip_vary         on;       # Vary: Accept-Encoding so caches never serve gzip to a client that cannot read it
gzip_types
    application/javascript
    text/javascript
    text/css
    application/json
    application/manifest+json
    image/svg+xml
    text/plain
    text/csv
    text/xml
    application/xml;
