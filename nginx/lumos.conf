# ─────────────────────────────────────────────────────────────
# Lumos HRMS — Nginx reverse proxy config
# Place in /etc/nginx/sites-available/ on the VPS
# Then: ln -s /etc/nginx/sites-available/lumos.conf /etc/nginx/sites-enabled/
#
# Domains served:
#   Primary  : https://hrms.lumoslogic.com  (SSL via certbot)
#   Fallback : http://hrms.recruitx-ai.com  (HTTP; run certbot to add SSL)
# ─────────────────────────────────────────────────────────────

# ── recruitx-ai.com — fallback domain (HTTP) ─────────────────
server {
    listen 80;
    server_name hrms.recruitx-ai.com;

    client_max_body_size 20M;

    # gzip for JS / CSS / JSON / SVG (see lumos-compression.conf; install it to /etc/nginx/snippets/)
    include snippets/lumos-compression.conf;

    # ZKTeco ADMS biometric push (if devices point to this domain)
    location /iclock/ {
        proxy_pass         http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 5s;
    }

    location / {
        proxy_pass         http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# ── lumoslogic.com — primary domain ──────────────────────────
server {
    listen 80;
    server_name hrms.lumoslogic.com;

    # Let's Encrypt challenge (certbot uses this)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS after cert is issued
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name hrms.lumoslogic.com;

    # SSL — filled in by certbot automatically
    ssl_certificate     /etc/letsencrypt/live/hrms.lumoslogic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrms.lumoslogic.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20M;   # allow file uploads up to 20MB

    # gzip for JS / CSS / JSON / SVG (see lumos-compression.conf; install it to /etc/nginx/snippets/)
    include snippets/lumos-compression.conf;

    # ── ZKTeco ADMS endpoints (biometric devices push here) ──
    # These must respond fast — device has 2s timeout
    location /iclock/ {
        proxy_pass         http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 5s;
    }

    # ── All other traffic → Node.js app ──────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
